name: Docker generic Build

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON array of images to build'
        required: true
        type: string
      runs-on:
        description: 'Runner to use for the job'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      REGISTRY_ENDPOINT:
        required: false
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false
      CONTAINER_REGISTRY_SCW_INFRA_ENDPOINT:
        required: false
      SCW_CONTAINER_REGISTRY_INFRA_SECRET_KEY:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(inputs.images) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pad run number
        id: pad
        run: echo "run_number=$(printf '%03d' ${{ github.run_number }})" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ secrets.REGISTRY_ENDPOINT || secrets.CONTAINER_REGISTRY_SCW_INFRA_ENDPOINT }}
          username: ${{ secrets.REGISTRY_USERNAME || 'nologin' }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.SCW_CONTAINER_REGISTRY_INFRA_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.REGISTRY_ENDPOINT || secrets.CONTAINER_REGISTRY_SCW_INFRA_ENDPOINT }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ steps.pad.outputs.run_number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=rc-{{date 'YYYY.MM.DD'}}-${{ steps.pad.outputs.run_number }},enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ matrix.image.build-args && join(matrix.image.build-args, '\n') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Build summary
        run: |
          echo "## 🐳 ${{ matrix.image.name }} built successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
