name: List hottest dependencies PRs
description: >-
  List repositories containing the maximum dependencies PRs (renovate)

os: ubuntu-latest

outputs:
  repositories:
    description: Repositories list with open Renovate PRs
    value: ${{ steps.list-repositories.outputs.repositories }}
runs:
  using: composite
  steps:
    - name: List repositories containing the maximum dependencies PRs
      id: list-repositories
      run: |
        RESULT=$(gh search prs --owner 1024pix --label dependencies --state open --archived=false --limit 300 --json=repository,number,title --jq 'group_by(.repository.name) | map({repo: .[0].repository.name, prs: length}) | map(select(.prs >= 5)) | sort_by(.prs) | reverse | .[] | "\(.repo) = \(.prs)"')
        {
          echo "repositories<<EOF"
          echo "$RESULT"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"
      shell: bash
