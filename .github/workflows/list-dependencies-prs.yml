name: List hottest dependencies PRs

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  list-dependencies-prs:
    runs-on: ubuntu-latest
    steps:
      - run: 'gh search prs --owner 1024pix --label dependencies --state open --archived=false --limit 300 --json=repository,number,title --jq ''group_by(.repository.name) | map({repo: .[0].repository.name, prs: length}) | map(select(.prs >= 5)) | sort_by(.prs) | reverse | .[] | "\(.repo) = \(.prs)"'''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
